name: Kawaii_poly

services:
  app:
    build:
      context: .
    image: kawaiipoly:latest
    container_name: Kawaii_poly
    env_file:
      - .env
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      PORT: 3000
      MARKET_DATA_SOURCE: binance
      PREDICTION_RECORDS_ENABLED: "true"
      PREDICTION_RECORD_DIR: /records
      STATS_DB_ENABLED: "true"
      STATS_DB_PATH: /app/data/polymarket-stats.db
      # 5s 太密：四币×双周期串行拉盘会拖死整站；并行+缓存后仍用 10s 降压
      PREDICTION_RECORD_POLL_INTERVAL_MS: 10000
      PREDICTION_RECORD_SYMBOLS: BTC-USD,ETH-USD,SOL-USD,XRP-USD
      # 5m 在开盘约 1分48秒必须完成方向锁定，给轮询留余量，确保两分钟内结束判断。
      FIVE_MINUTE_DECISION_TERMINAL_LOCK_ELAPSED_PCT: 0.36
      FIVE_MINUTE_DECISION_STRONG_PM_GAP: 0.60
      FIVE_MINUTE_DECISION_NORMAL_PM_GAP: 0.30
      FIVE_MINUTE_DECISION_LOW_WINRATE_HOUR_GUARD_ENABLED: "true"
      FIVE_MINUTE_DECISION_LOW_WINRATE_PRIMARY_HOUR: 13
      FIVE_MINUTE_DECISION_LOW_WINRATE_PRIMARY_MIN_PM_GAP: 0.35
      FIVE_MINUTE_DECISION_LOW_WINRATE_PRIMARY_MIN_CONFIDENCE: 0.66
      FIFTEEN_MINUTE_DECISION_STRONG_PM_GAP: 0.60
      FIFTEEN_MINUTE_DECISION_NORMAL_PM_GAP: 0.30
      FIFTEEN_MINUTE_DECISION_LOW_WINRATE_HOUR_GUARD_ENABLED: "true"
      FIFTEEN_MINUTE_DECISION_LOW_WINRATE_PRIMARY_HOUR: 6
      FIFTEEN_MINUTE_DECISION_LOW_WINRATE_PRIMARY_MIN_PM_GAP: 0.40
      FIFTEEN_MINUTE_DECISION_LOW_WINRATE_PRIMARY_MIN_CONFIDENCE: 0.68
      FIFTEEN_MINUTE_DECISION_LOW_WINRATE_SECONDARY_HOUR: 20
      FIFTEEN_MINUTE_DECISION_LOW_WINRATE_SECONDARY_MIN_PM_GAP: 0.30
      FIFTEEN_MINUTE_DECISION_LOW_WINRATE_SECONDARY_MIN_CONFIDENCE: 0.65
      NEXT_SLOT_PREDICTION_LOCK_MIN_ELAPSED_PCT: 0.5
      NEXT_SLOT_PREDICTION_LOCK_MIN_PM_GAP: 0.06
      NEXT_SLOT_PREDICTION_LOCK_MIN_STRENGTH: normal
      NEXT_SLOT_PREDICTION_ALLOW_WEAK: "true"
      NEXT_SLOT_PREDICTION_LOCK_WEAK_MIN_ELAPSED_PCT: 0.6
      NEXT_SLOT_PREDICTION_LOCK_HARD_MIN_ELAPSED_PCT: 0.9
      NEXT_SLOT_PREDICTION_LOCK_HARD_MAX_REMAINING_SEC: 30
      FIVE_MINUTE_NEXT_SLOT_PREDICTION_LOCK_HARD_MAX_REMAINING_SEC: 30
      FIFTEEN_MINUTE_NEXT_SLOT_PREDICTION_LOCK_HARD_MAX_REMAINING_SEC: 60
      HOURLY_MONITOR_ENABLED: "true"
      HOURLY_MONITOR_INTERVAL_MS: 3600000
      POLYMARKET_ENABLED: "true"
      # Paper-only research phase: this global kill switch prevents every core live order path.
      POLYMARKET_LIVE_TRADING_ENABLED: "true"
      # Paper decisions must use the exact production judgment and entry constraints.
      POLYMARKET_PAPER_LIVE_PARITY_ENABLED: "true"
      POLYMARKET_BLEND_ENABLED: "true"
      POLYMARKET_BTC_TIMEFRAME: 15m
      POLYMARKET_REQUEST_TIMEOUT_MS: 15000
      POLYMARKET_CLOB_REQUEST_TIMEOUT_MS: 6000
      # 账户/授权/余额联合刷新超过此时间即回退缓存，不能拖死所有实盘计划。
      POLYMARKET_READINESS_REFRESH_TIMEOUT_MS: 20000
      POLYMARKET_DEFAULT_ORDER_USD: 5
      POLYMARKET_MAX_ORDER_USD: 500
      POLYMARKET_LIVE_MAX_ORDER_USD: 100
      # 日亏停：用户关闭，保持关闭
      POLYMARKET_GLOBAL_DAILY_LOSS_PROTECTION_ENABLED: "false"
      POLYMARKET_DAILY_MAX_LOSS_USD: 0
      POLYMARKET_GLOBAL_DAILY_LOSS_LIMIT_PCT: 0.24
      POLYMARKET_PAPER_STARTING_CASH: 500
      POLYMARKET_SIZING_BASE_PRINCIPAL: 500
      POLYMARKET_ORDER_PCT_15M: 0.10
      POLYMARKET_ORDER_PCT_5M: 0.08
      POLYMARKET_ORDER_USD_15M: 30
      POLYMARKET_ORDER_USD_5M: 20
      # $50 账户：单笔约 10–15%，不靠缩单刷胜率
      POLYMARKET_MAX_ORDER_EQUITY_PCT: 0.15
      POLYMARKET_LIVE_ADAPTIVE_CAP_ENABLED: "true"
      POLYMARKET_LIVE_ADAPTIVE_CAP_BASE_EQUITY_PCT: 0.12
      POLYMARKET_LIVE_ADAPTIVE_CAP_FLOOR_EQUITY_PCT: 0.10
      POLYMARKET_LIVE_ADAPTIVE_CAP_MAX_EQUITY_PCT: 0.15
      POLYMARKET_LIVE_ADAPTIVE_CAP_MIN_SAMPLES: 12
      POLYMARKET_LIVE_ADAPTIVE_CAP_LOOKBACK_DAYS: 30
      POLYMARKET_LIVE_ADAPTIVE_CAP_PAPER_WEIGHT: 0.20
      # ~$11 账户：25%/35% 只剩 $2.7，低于 CLOB 最小 $5；抬到 55% 才能真下最小单
      POLYMARKET_MAX_TOTAL_OPEN_EXPOSURE_PCT: 0.55
      POLYMARKET_MAX_TIMEFRAME_OPEN_EXPOSURE_PCT: 0.55
      # 小资金总暴露帽与现金约束重复，先关；本金做大后再开
      POLYMARKET_GLOBAL_EXPOSURE_CAP_ENABLED: "false"
      POLYMARKET_GLOBAL_EXPOSURE_MODE: total_only
      POLYMARKET_GLOBAL_SLOT_DIRECTION_MAX_EXPOSURE_PCT: 0.15
      POLYMARKET_GLOBAL_TIMEFRAME_MAX_EXPOSURE_PCT: 0.20
      POLYMARKET_GLOBAL_TOTAL_BTC_MARKET_EXPOSURE_PCT: 0.35
      POLYMARKET_MIN_ORDER_USD: 5
      # Plan1：$50 正常仓，CLOB 可执行底 $5，不故意砍小
      POLYMARKET_PLAN1_LIVE_MIN_ORDER_USD: 5
      POLYMARKET_PLAN1_LIVE_EXECUTABLE_FLOOR_USD: 5
      POLYMARKET_PLAN1_LIVE_MAX_ORDER_CASH_PCT: 0.15
      # 1 仓太脆：结算延迟/僵尸仓会整下午开不了新单；小资金用 2 兼顾不断档与控敞口
      POLYMARKET_PLAN1_MAX_OPEN_LIVE_POSITIONS: 2
      POLYMARKET_MIN_EDGE_5M: 0.06
      POLYMARKET_MIN_EDGE_15M: 0.04
      POLYMARKET_MIN_MARKET_QUALITY: 0.40
      POLYMARKET_MIN_CONFIDENCE_5M: 0.58
      POLYMARKET_MIN_CONFIDENCE_15M: 0.56
      POLYMARKET_PLAN1_MIN_MARKET_QUALITY: 0.45
      # Plan1 实盘复盘：SOL/XRP 长期拖累，只保留 BTC/ETH
      POLYMARKET_PLAN1_SYMBOLS: BTC-USD,ETH-USD
      # 复盘：SOL 模拟盘长期拖累（2.5 约 -$216），先踢出扫描
      POLYMARKET_PLAN2_SYMBOLS: BTC-USD,ETH-USD,XRP-USD
      POLYMARKET_PLAN2_CROSS_SYMBOL_ENABLED: "true"
      POLYMARKET_PLAN2_CROSS_SYMBOL_MIN_LEADER_CONFIDENCE: 0.62
      POLYMARKET_PLAN2_CROSS_SYMBOL_ALIGN_BOOST: 0.02
      POLYMARKET_PLAN2_CROSS_FOLLOW_ENABLED: "false"
      POLYMARKET_PLAN2_CROSS_FOLLOW_MIN_LEADER_CONFIDENCE: 0.64
      POLYMARKET_PLAN2_CROSS_FOLLOW_MIN_DISCOUNT: 0.04
      POLYMARKET_PLAN2_CROSS_FOLLOW_MAX_OPPOSING_GAP: 0.10
      POLYMARKET_PLAN2_CROSS_FOLLOW_MIN_PRICE: 0.40
      POLYMARKET_PLAN2_CROSS_FOLLOW_MAX_PRICE: 0.85
      POLYMARKET_PLAN2_CROSS_FOLLOW_MIN_ELAPSED_PCT: 0.10
      POLYMARKET_PLAN2_CROSS_FOLLOW_MAX_ELAPSED_PCT: 0.72
      POLYMARKET_PLAN2_CROSS_FOLLOW_MAX_REVERSE_DISTANCE_BPS: 6
      POLYMARKET_PLAN2_CROSS_FOLLOW_MIN_QUALITY: 0.35
      POLYMARKET_PLAN2_CROSS_FOLLOW_SIZE_MULTIPLIER: 0.35
      POLYMARKET_PLAN1_MIN_EDGE_5M: 0.03
      POLYMARKET_PLAN1_MIN_EDGE_15M: 0.025
      # 昨夜 28% WR：廉价侧全灭；置信度略收回，宁缺毋滥
      POLYMARKET_PLAN1_MIN_CONFIDENCE: 0.58
      POLYMARKET_PLAN1_BASKET_CONFLICT_PROBE_ENABLED: "false"
      # 昨夜唯一正期望带 0.55-0.62；上限收到 0.64，禁止追高
      POLYMARKET_PLAN1_MAX_ENTRY_PRICE: 0.64
      POLYMARKET_PLAN1_MAX_ENTRY_PRICE_5M: 0.64
      POLYMARKET_PLAN1_MAX_ENTRY_PRICE_15M: 0.64
      # 禁 <0.55：昨夜该带 7/7 全损
      POLYMARKET_PLAN1_MIN_ENTRY_PRICE: 0.55
      POLYMARKET_PLAN1_MIN_ENTRY_PRICE_5M: 0.55
      POLYMARKET_PLAN1_MIN_ENTRY_PRICE_15M: 0.55
      POLYMARKET_PLAN1_ENTRY_MIN_ELAPSED_PCT: 0.10
      POLYMARKET_PLAN1_ENTRY_MAX_ELAPSED_PCT: 0.70
      POLYMARKET_PLAN1_ENTRY_MIN_ELAPSED_PCT_5M: 0.10
      POLYMARKET_PLAN1_ENTRY_MAX_ELAPSED_PCT_5M: 0.65
      POLYMARKET_PLAN1_ENTRY_MIN_ELAPSED_PCT_15M: 0.10
      POLYMARKET_PLAN1_ENTRY_MAX_ELAPSED_PCT_15M: 0.70
      POLYMARKET_PLAN1_TAKE_PROFIT_OFFSET: 0.12
      POLYMARKET_PLAN1_STOP_LOSS_OFFSET: 0.08
      # 关掉持有到结算：恢复止损/止盈路径，避免输一次 -100%
      POLYMARKET_PLAN1_HOLD_TO_SETTLEMENT_ENABLED: "false"
      POLYMARKET_PLAN1_STOP_LOSS_ABSOLUTE_FLOOR: 0.45
      # 止损确认加快：止损必须及时
      POLYMARKET_PLAN1_LIVE_STOP_CONFIRMATION_ENABLED: "true"
      POLYMARKET_PLAN1_LIVE_STOP_CONFIRM_SAMPLES: 2
      POLYMARKET_PLAN1_LIVE_STOP_CONFIRM_MS_5M: 3000
      POLYMARKET_PLAN1_LIVE_STOP_CONFIRM_MS_15M: 6000
      POLYMARKET_PLAN1_TIME_STOP_REMAINING_PCT: 0.25
      # 15m 允许方向反转离场；5m 仍关（太噪）
      POLYMARKET_PLAN1_DIRECTION_FLIP_ENABLED: "false"
      POLYMARKET_PLAN1_DIRECTION_FLIP_ENABLED_5M: "false"
      POLYMARKET_PLAN1_DIRECTION_FLIP_ENABLED_15M: "true"
      POLYMARKET_5M_PATH_EXPERIMENT_ENABLED: "true"
      POLYMARKET_PLAN1_5M_PATH_GUARD_ENABLED: "true"
      POLYMARKET_5M_PATH_MIN_SAMPLES: 8
      POLYMARKET_5M_PATH_MIN_IMPULSE_BPS: 4
      POLYMARKET_5M_PATH_MAX_START_ELAPSED_PCT: 0.12
      POLYMARKET_5M_PATH_MAX_PLATEAU_RANGE_BPS: 4
      POLYMARKET_5M_PATH_MAX_PLATEAU_DRIFT_BPS: 3
      POLYMARKET_5M_PATH_MIN_RETRACEMENT_RATIO: 0.45
      POLYMARKET_5M_PATH_MIN_REVERSAL_BPS: 4
      POLYMARKET_5M_PATH_MIN_LATE_HOLD_MS: 20000
      POLYMARKET_5M_PATH_MIN_PM_GAP: 0.04
      POLYMARKET_PLAN1_FLIP_COOLDOWN_MS: 120000
      POLYMARKET_PLAN1_FLIP_MIN_HOLD_MS: 90000
      POLYMARKET_PLAN1_FLIP_MIN_CONFIDENCE: 0.64
      POLYMARKET_PLAN1_FLIP_MIN_EDGE: 0.035
      POLYMARKET_PLAN1_FLIP_MAX_FLOATING_LOSS_PCT: 0.25
      POLYMARKET_PLAN1_FLIP_MAX_ELAPSED_PCT: 0.80
      POLYMARKET_PLAN1_BASKET_CONFLICT_PROBE_MULTIPLIER: 0.15
      POLYMARKET_PLAN1_HISTORY_HIERARCHY_ENABLED: "true"
      # 保胜率版：关掉尾盘高价追热门；主单不够价就不做
      POLYMARKET_PLAN1_LATE_CAPTURE_ENABLED: "false"
      POLYMARKET_PLAN1_LATE_CAPTURE_MIN_PRICE: 0.70
      POLYMARKET_PLAN1_LATE_CAPTURE_MAX_PRICE: 0.88
      POLYMARKET_PLAN1_LATE_CAPTURE_MIN_ELAPSED_PCT: 0.45
      POLYMARKET_PLAN1_LATE_CAPTURE_MAX_ELAPSED_PCT: 0.92
      POLYMARKET_PLAN1_LATE_CAPTURE_MIN_DISTANCE_BPS: 5
      POLYMARKET_PLAN1_LATE_CAPTURE_MIN_MARKET_QUALITY: 0.45
      POLYMARKET_PLAN1_LATE_CAPTURE_MID_SIZE_MULTIPLIER: 0.35
      POLYMARKET_PLAN1_LATE_CAPTURE_HIGH_SIZE_MULTIPLIER: 0.18
      POLYMARKET_PLAN1_LATE_CAPTURE_MIN_CONFIDENCE: 0.60
      POLYMARKET_PLAN1_OPPOSITE_HEDGE_ENABLED: "false"
      POLYMARKET_PLAN1_OPPOSITE_HEDGE_MAX_PRICE: 0.15
      POLYMARKET_PLAN1_OPPOSITE_HEDGE_SIZE_PCT: 0.05
      POLYMARKET_LIVE_MIN_HOLD_BEFORE_EXIT_MS_5M: 7000
      POLYMARKET_LIVE_MIN_HOLD_BEFORE_EXIT_MS_15M: 20000
      POLYMARKET_LIVE_EXIT_RETRY_MS_5M: 3000
      POLYMARKET_LIVE_EXIT_RETRY_MS_5M_URGENT: 2000
      POLYMARKET_LIVE_EXIT_RETRY_MS_5M_TAKE_PROFIT: 12000
      POLYMARKET_LIVE_EXIT_RETRY_MS_15M: 20000
      POLYMARKET_LIVE_EXIT_RETRY_MS_15M_TAKE_PROFIT: 25000
      POLYMARKET_LIVE_MIN_HOLD_BYPASS_ON_HARD_STOP: "true"
      POLYMARKET_LIVE_MIN_HOLD_BYPASS_ON_STOP_LOSS_5M: "true"
      POLYMARKET_LIVE_TAKE_PROFIT_SELL_USE_GTC: "true"
      POLYMARKET_PLAN1_PREPOSTED_TAKE_PROFIT_ENABLED: "false"
      POLYMARKET_LIVE_TAKE_PROFIT_GTC_SELL_OFFSET: 0.005
      POLYMARKET_LIVE_SELL_RETRY_DELAYS_MS_5M_STOP: "0,1500,3500"
      POLYMARKET_LIVE_SELL_RETRY_DELAYS_MS_TAKE_PROFIT: "0,5000,12000"
      POLYMARKET_LIVE_SELL_SHARE_RATIO: 1
      POLYMARKET_LIVE_DYNAMIC_SELL_LIMIT: "true"
      POLYMARKET_LIVE_STOP_SELL_OFFSET_5M: 0.03
      POLYMARKET_LIVE_STOP_SELL_OFFSET_15M: 0.02
      POLYMARKET_LIVE_TAKE_PROFIT_SELL_OFFSET: 0.005
      POLYMARKET_LIVE_URGENT_SELL_EXTRA_OFFSET: 0.01
      POLYMARKET_LIVE_MIN_SELL_LIMIT_PRICE: 0.01
      POLYMARKET_PLAN2_ENTRY_MIN_PRICE: 0.60
      POLYMARKET_PLAN2_ENTRY_MAX_PRICE: 0.62
      # Plan2.5：高价到期结算赢小亏大（≥0.80 约 -$287）。上限收到 0.75。
      # Plan2.6 entry-max is set with the Plan2.6 block below.
      POLYMARKET_PLAN2_5_LIVE_ENTRY_MAX_ENABLED: "true"
      POLYMARKET_PLAN2_5_ENTRY_MAX_PRICE: 0.75
      POLYMARKET_PLAN2_5_ENTRY_HARD_MAX_PRICE: 0.78
      POLYMARKET_PLAN2_MIN_CONFIDENCE: 0.64
      POLYMARKET_PLAN2_MIN_EDGE: 0.08
      POLYMARKET_PLAN2_DOWN_MIN_CONFIDENCE_5M: 0.64
      POLYMARKET_PLAN2_DOWN_MIN_CONFIDENCE_15M: 0.64
      POLYMARKET_PLAN2_DOWN_MIN_EDGE: 0.08
      POLYMARKET_PLAN2_REGIME_FILTER_ENABLED: "true"
      POLYMARKET_PLAN2_CHOP_MAX_DISTANCE_BPS: 4
      POLYMARKET_PLAN2_CHOP_MAX_PM_EDGE: 0.06
      POLYMARKET_PLAN2_CHOP_MIN_DIRECTION_FLIPS: 3
      POLYMARKET_PLAN2_CHOP_MAX_TECH_CONFIDENCE: 0.62
      POLYMARKET_PLAN2_CHOP_ALLOW_PROBE: "true"
      POLYMARKET_PLAN2_CHOP_MAIN_SIZE_SCALE: 0.35
      POLYMARKET_PLAN2_REGIME_MILD_SIZE_SCALE: 0.80
      POLYMARKET_PLAN2_REGIME_SKIP_MAIN_RISK: 4
      POLYMARKET_PLAN2_REGIME_SKIP_ALL_RISK: 5
      POLYMARKET_PLAN2_REGIME_MAX_SPREAD: 0.06
      POLYMARKET_PLAN2_REGIME_MAX_VOL_BPS_5M: 18
      POLYMARKET_PLAN2_REGIME_MAX_VOL_BPS_15M: 14
      # 高价尾盘/90¢ 扫盘在 2.5 模拟盘负 EV，先关掉；靠探针+中价动量
      POLYMARKET_PLAN2_ULTRA_LATE_CAPTURE_ENABLED: "false"
      POLYMARKET_PLAN2_ULTRA_LATE_CAPTURE_MIN_SECONDS_5M: 10
      POLYMARKET_PLAN2_ULTRA_LATE_CAPTURE_MAX_SECONDS_5M: 60
      POLYMARKET_PLAN2_ULTRA_LATE_CAPTURE_MIN_SECONDS_15M: 15
      POLYMARKET_PLAN2_ULTRA_LATE_CAPTURE_MAX_SECONDS_15M: 90
      POLYMARKET_PLAN2_ULTRA_LATE_CAPTURE_SIZE_MULTIPLIER: 0.04
      POLYMARKET_PLAN2_SETTLEMENT_CAPTURE_90_ENABLED: "false"
      POLYMARKET_PLAN2_ENTRY_MIN_ELAPSED_PCT: 0.08
      POLYMARKET_PLAN2_MAX_ENTRY_ELAPSED_PCT: 0.78
      POLYMARKET_PLAN2_MAX_ENTRY_ELAPSED_PCT_5M: 0.78
      POLYMARKET_PLAN2_MAX_ENTRY_ELAPSED_PCT_15M: 0.84
      POLYMARKET_PLAN2_TAKE_PROFIT_OFFSET: 0.20
      POLYMARKET_PLAN2_TAKE_PROFIT_ENABLED: "false"
      # 固定 TP 仍关。回撤止盈不要写进 2.5/2.6；Plan13 本版也不止盈。
      POLYMARKET_PLAN2_TRAILING_TAKE_PROFIT_ENABLED: "false"
      POLYMARKET_PLAN2_TRAILING_TAKE_PROFIT_OFFSET: 0.10
      POLYMARKET_PLAN2_STOP_LOSS_OFFSET: 0.08
      POLYMARKET_PLAN2_STOP_LOSS_ENABLED: "true"
      POLYMARKET_PLAN2_DYNAMIC_EXIT: "false"
      POLYMARKET_PLAN2_PROBE_STOP_LOSS_OFFSET_5M: 0.16
      POLYMARKET_PLAN2_PROBE_STOP_LOSS_OFFSET_15M: 0.14
      POLYMARKET_PLAN2_EXIT_HOLD_CONFIDENCE_PROBE: 0.54
      POLYMARKET_PLAN2_MIN_HOLD_BEFORE_EXIT_MS_5M: 120000
      POLYMARKET_LIVE_MIN_HOLD_BEFORE_EXIT_MS_PROBE_5M: 45000
      POLYMARKET_LIVE_MIN_HOLD_BEFORE_EXIT_MS_PROBE_15M: 60000
      POLYMARKET_PLAN2_HIGH_ENTRY_MIN_PRICE: 0.70
      POLYMARKET_PLAN2_HIGH_ENTRY_DELAY_MS: 10000
      POLYMARKET_PLAN2_HIGH_ENTRY_DELAY_MS_5M: 4000
      POLYMARKET_PLAN2_HIGH_ENTRY_DELAY_MS_15M: 10000
      # late_capture 2.5 模拟约 -$92，先关
      POLYMARKET_PLAN2_LATE_CAPTURE_ENABLED: "false"
      POLYMARKET_PLAN2_LATE_CAPTURE_MIN_ELAPSED_PCT: 0.75
      POLYMARKET_PLAN2_LATE_CAPTURE_MAX_ELAPSED_PCT: 0.96
      POLYMARKET_PLAN2_LATE_CAPTURE_MIN_PRICE: 0.70
      POLYMARKET_PLAN2_LATE_CAPTURE_MAX_PRICE: 0.75
      POLYMARKET_PLAN2_LATE_CAPTURE_MIN_DISTANCE_BPS: 5
      POLYMARKET_PLAN2_LATE_CAPTURE_MAX_REVERSE_BPS: 3
      POLYMARKET_PLAN2_LATE_CAPTURE_MIN_QUALITY: 0.42
      POLYMARKET_PLAN2_LATE_CAPTURE_SIZE_MULTIPLIER: 0.20
      # 动量只留中价带；15m 原先默认上限 0.85 是出血点
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MAX_PRICE_5M: 0.75
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MAX_PULLBACK_5M: 0.015
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MIN_SAMPLES_5M: 8
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MIN_HOLD_MS_5M: 30000
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MAX_REVERSE_BPS_5M: 3
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_SIZE_MULTIPLIER_5M: 0.30
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MIN_PRICE_15M: 0.65
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MAX_PRICE_15M: 0.75
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MAX_PULLBACK_15M: 0.015
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MIN_SAMPLES_15M: 8
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MIN_HOLD_MS_15M: 60000
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MAX_REVERSE_BPS_15M: 3
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_MIN_QUALITY: 0.55
      POLYMARKET_PLAN2_SUSTAINED_MOMENTUM_SIZE_MULTIPLIER_15M: 0.35
      POLYMARKET_PLAN2_STOP_LOSS_REVERSAL_ENABLED: "true"
      POLYMARKET_PLAN2_STOP_LOSS_REVERSAL_MIN_CONFIDENCE: 0.58
      POLYMARKET_PLAN2_STOP_LOSS_REVERSAL_MIN_EDGE: 0.04
      POLYMARKET_PLAN2_STOP_LOSS_REVERSAL_MAX_ELAPSED_PCT_5M: 0.75
      POLYMARKET_PLAN2_STOP_LOSS_REVERSAL_MAX_ELAPSED_PCT_15M: 0.80
      POLYMARKET_PLAN2_STOP_LOSS_REVERSAL_SIZE_MULTIPLIER_5M: 0.35
      POLYMARKET_PLAN2_STOP_LOSS_REVERSAL_SIZE_MULTIPLIER_15M: 0.30
      POLYMARKET_PLAN2_STOP_LOSS_REVERSAL_AFTER_DIRECTION_STOP: "false"
      POLYMARKET_PLAN2_LIVE_SLOT_LOSS_CIRCUIT_ENABLED: "true"
      POLYMARKET_PLAN2_LIVE_SLOT_LOSS_CIRCUIT_MAX_LOSSES: 2
      POLYMARKET_PLAN2_CLASSIC_HISTORY_GATE_ENABLED: "false"
      POLYMARKET_PLAN2_CLASSIC_LOSS_REASON_GATE_ENABLED: "false"
      POLYMARKET_PLAN2_CLASSIC_SYMBOL_WR_SIZING_ENABLED: "true"
