      POLYMARKET_PLAN5_PRICE_CALIBRATION_ENABLED: "true"
      POLYMARKET_PLAN5_PRICE_CALIBRATION_RECENT_SAMPLES: 20
      POLYMARKET_PLAN5_PRICE_CALIBRATION_MIN_SAMPLES: 8
      POLYMARKET_PLAN5_PRICE_CALIBRATION_WEIGHT: 0.20
      POLYMARKET_PLAN5_DIRECTION_MIN_PROBABILITY_EDGE: 0.005
      POLYMARKET_PLAN5_DIRECTION_MIN_EXPECTED_ROI: 0.01
      POLYMARKET_PLAN5_LIVE_PREFLIGHT_ENABLED: "true"
      POLYMARKET_PLAN5_LIVE_MIN_SECONDS_REMAINING: 5
      # 锁定方向后不因 token 上涨而拦截；按最新可成交价继续提交。
      POLYMARKET_PLAN5_LIVE_MAX_PRICE_CHASE_ABS: 0.03
      # 决策价回撤过大直接拒单（防止 66¢ 锁 UP 却在 26¢ 成交）
      POLYMARKET_PLAN5_LIVE_MAX_ADVERSE_PRICE_DROP_ABS: 0.12
      POLYMARKET_PLAN5_LIVE_MAX_ADVERSE_PRICE_DROP_PCT: 0.25
      # 锁定后忽略相对锁定价的普通涨跌；仅所选 token 跌破 20¢ 时视为可能反转。
      POLYMARKET_PLAN5_LIVE_REVERSAL_PRICE_THRESHOLD: 0.20
      POLYMARKET_PLAN5_LIVE_REVERSAL_MICRO_PROBE_ENABLED: "false"
      POLYMARKET_PLAN5_DIRECTION_RECHECK_ENABLED: "true"
      POLYMARKET_PLAN5_DIRECTION_RECHECK_COLLAPSE_PRICE: 0.54
      POLYMARKET_PLAN5_DIRECTION_RECHECK_MIN_DROP_ABS: 0.04
      POLYMARKET_PLAN5_DIRECTION_RECHECK_EXTREME_PRICE: 0.20
      # 实盘历史：15–20¢ ROI +15.3%，仅保留约 $1 探索仓；低于 15¢ 仍硬拦截。
      POLYMARKET_PLAN5_LIVE_REVERSAL_PROBE_FLOOR: 0.15
      POLYMARKET_PLAN5_LIVE_REVERSAL_PROBE_SIZE_SCALE: 0.20
      # 近期锁定样本显示 PM 方向显著优于技术/综合方向；以 PM 锁定为主，
      # 技术面不再重复否决，后续仍由稳定性、当前盘口、价格与硬 EV 门控。
      POLYMARKET_PLAN5_CONSENSUS_ENABLED: "true"
      POLYMARKET_PLAN5_CONSENSUS_MIN_CONFIDENCE_5M: 0.70
      POLYMARKET_PLAN5_CONSENSUS_MIN_CONFIDENCE_15M: 0.70
      POLYMARKET_PLAN5_CONSENSUS_MIN_PM_GAP: 0.30
      POLYMARKET_PLAN5_CONSENSUS_MIN_PM_GAP_5M: 0.30
      POLYMARKET_PLAN5_CONSENSUS_MIN_PM_GAP_15M: 0.40
      POLYMARKET_PLAN5_CONSENSUS_REQUIRE_TECH_ALIGNMENT: "true"
      POLYMARKET_PLAN5_CONSENSUS_REQUIRE_SPOT_ALIGNMENT: "true"
      POLYMARKET_PLAN5_ENTRY_TIMING_ENABLED: "true"
      POLYMARKET_PLAN5_MIN_ELAPSED_PCT_5M: 0.25
      POLYMARKET_PLAN5_MIN_ELAPSED_PCT_15M: 0.25
      POLYMARKET_PLAN5_WEAK_MIN_ELAPSED_PCT_5M: 0.25
      POLYMARKET_PLAN5_WEAK_MIN_ELAPSED_PCT_15M: 0.25
      # 锁定方向已包含稳定/幅度判断，Plan5 不再额外等待 15 秒。
      POLYMARKET_PLAN5_MIN_LOCK_AGE_MS_5M: 0
      POLYMARKET_PLAN5_MIN_LOCK_AGE_MS_15M: 30000
      POLYMARKET_PLAN5_STOP_LOSS_ENABLED: "false"
      POLYMARKET_PLAN5_CONDITIONAL_STOP_PRICE: 0.30
      POLYMARKET_PLAN5_EMERGENCY_STOP_PRICE: 0.20
      POLYMARKET_PLAN5_OPPORTUNITY_LOG_ENABLED: "true"
      POLYMARKET_PLAN5_OPPORTUNITY_LOG_MAX_ENTRIES: 800
      POLYMARKET_PLAN5_SHADOW_ENABLED: "true"
      POLYMARKET_PLAN5_SHADOW_MAX_ENTRIES: 10000
      POLYMARKET_PLAN5_SHADOW_HYPOTHETICAL_USD: 5
      POLYMARKET_PLAN5_ADAPTIVE_SIZING_ENABLED: "false"
      POLYMARKET_PLAN5_SAME_DIR_BOOST_ENABLED: "true"
      POLYMARKET_PLAN5_SAME_DIR_BOOST: 1.25
      POLYMARKET_PLAN5_SAME_DIR_BOOST_MAX: 1.35
      POLYMARKET_PLAN5_SAME_DIR_MIN_SAMPLES: 15
      POLYMARKET_PLAN5_SAME_DIR_MIN_EDGE: 0.03
      # v6：关闭下一槽预开仓
      POLYMARKET_PLAN5_PRE_OPEN_ENABLED: "false"
      POLYMARKET_PLAN5_PRE_OPEN_MIN_ACCURACY: 0.65
      POLYMARKET_PLAN5_PRE_OPEN_MIN_SAMPLES: 20
      POLYMARKET_PLAN5_PRE_OPEN_SIZE_FRACTION: 0.4
      POLYMARKET_PLAN5_COMBINED_SIZE_SCALE_CAP: 1.8
      POLYMARKET_PLAN5_SLOT_EXPOSURE_ENABLED: "true"
      POLYMARKET_PLAN5_SLOT_MAX_SYMBOLS: "2"
      POLYMARKET_PLAN5_SLOT_MAX_EXPOSURE_PCT: "0.35"
      POLYMARKET_PLAN5_BASKET_ALLOCATION_ENABLED: "true"
      POLYMARKET_PLAN5_BASKET_MAX_SYMBOLS: "2"
      POLYMARKET_PLAN5_BASKET_PRIMARY_SHARE: "0.65"
      POLYMARKET_PLAN5_BASKET_MIN_EXPECTED_ROI: "0"
      POLYMARKET_PLAN5_BASKET_MIN_NET_EDGE: "0"
      POLYMARKET_PLAN5_LIVE_LOSS_CIRCUIT_ENABLED: "true"
      POLYMARKET_PLAN5_LIVE_LOSS_CIRCUIT_MAX_LOSSES: "3"
      POLYMARKET_PLAN5_LIVE_LOSS_CIRCUIT_COOLDOWN_ENABLED: "true"
      POLYMARKET_PLAN5_LIVE_LOSS_CIRCUIT_COOLDOWN_MS: "2700000"
      POLYMARKET_PLAN5_MIN_ENTRY_PRICE: "0.50"
      # 参考下限可软降仓；低于硬下限仍拒绝追彩票票（26¢ 这类）。15–20¢ 探索带仍由 live preflight 放行。
      POLYMARKET_PLAN5_HARD_MIN_ENTRY_PRICE: "0.35"
      POLYMARKET_PLAN5_MAX_ENTRY_PRICE: "0.80"
      POLYMARKET_PLAN5_PAPER_REQUIRE_ASK_FILLABLE: "true"
      POLYMARKET_PLAN5_PAPER_FILL_SLIPPAGE_TICKS: "1"
      POLYMARKET_PLAN5_PAPER_FILL_TICK_SIZE: "0.01"
      # Plan5 连输只按 streak sizing 减仓，不参加全局 4/5 连亏时间冷却。
      POLYMARKET_PLAN5_APPLY_LOSS_STREAK_SCALE: "false"
      POLYMARKET_PLAN5_STREAK_SIZING_ENABLED: "true"
    volumes:
      - "D:/Obsidian仓库/Kawaii的仓库/投资/虚拟币/比特币猜输赢记录:/records"
      - "./data:/app/data"
    restart: unless-stopped

  dashboard:
    image: kawaiipoly:latest
    container_name: Kawaii_poly_web
    depends_on:
      - app
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      PORT: 3000
      API_UPSTREAM_URL: http://app:3000
    command: ["node", "static-proxy.js"]
    restart: unless-stopped
